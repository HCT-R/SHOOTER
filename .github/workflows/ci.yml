name: Build and browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Node 24 / Chrome
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      NODE_VERSION: '24.14.0'
      # Fixed Chrome for Testing build; update this pin deliberately after checking screenshots.
      # Official manifests: https://googlechromelabs.github.io/chrome-for-testing/
      CHROME_VERSION: '154.0.8037.57'

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        id: install
        timeout-minutes: 2
        run: npm ci

      - name: Install pinned Chrome for Testing
        id: chrome
        timeout-minutes: 3
        run: |
          $chromeRoot = Join-Path $env:RUNNER_TEMP 'pixel-protocol-chrome'
          $chromeZip = Join-Path $env:RUNNER_TEMP 'pixel-protocol-chrome.zip'
          $chromeUrl = "https://storage.googleapis.com/chrome-for-testing-public/$env:CHROME_VERSION/win64/chrome-win64.zip"
          Invoke-WebRequest -Uri $chromeUrl -OutFile $chromeZip -TimeoutSec 120
          Expand-Archive -LiteralPath $chromeZip -DestinationPath $chromeRoot -Force
          $chromeExe = Join-Path $chromeRoot 'chrome-win64/chrome.exe'
          if (!(Test-Path -LiteralPath $chromeExe -PathType Leaf)) {
            throw 'The pinned Chrome archive did not contain chrome.exe.'
          }
          $chromeVersion = (Get-Item -LiteralPath $chromeExe).VersionInfo.ProductVersion
          if ($chromeVersion -ne $env:CHROME_VERSION) {
            throw "Expected Chrome $env:CHROME_VERSION; found $chromeVersion."
          }
          "CHROME_PATH=$chromeExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Hosted Windows images receive updates; record their actual revision alongside the pins.
          $versions = [ordered]@{
            node = (node --version)
            npm = (npm --version)
            chrome = $chromeVersion
            chromeDownload = $chromeUrl
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
          }
          $versions | ConvertTo-Json | Tee-Object -FilePath ci-versions.json

      - name: Build, unit tests, and headless gameplay smoke test
        timeout-minutes: 10
        run: |
          npm test 2>&1 | Tee-Object -FilePath ci-test.log
          exit $LASTEXITCODE

      - name: Capture menu screenshot
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          npm run shot:menu 2>&1 | Tee-Object -FilePath ci-screenshot.log
          exit $LASTEXITCODE

      - name: Upload screenshot and test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-browser-checks
          path: |
            menu.png
            ci-test.log
            ci-screenshot.log
            ci-versions.json
          if-no-files-found: warn
          retention-days: 14
